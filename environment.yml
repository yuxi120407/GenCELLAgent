name: gencell
channels:
  - conda-forge
  - pytorch
  - nvidia
  - defaults
dependencies:
  - python=3.12
  - pip
  - git
  - git-lfs
  # micro-sam (must be conda, pulls nifty/elf/torch_em automatically)
  # - micro_sam
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu126
      # Core
      - torch==2.7.0
      - torchvision==0.22.0
      - "numpy<2,>=1.26"
      - scipy
      - scikit-image
      - "imagecodecs<2025"

      # Segmentation tools
      - cellpose
      - git+https://github.com/vanvalenlab/cellSAM.git
      - git+https://github.com/facebookresearch/segment-anything.git
      - git+https://github.com/openai/CLIP.git

      # LLM & API
      - google-generativeai
      - google-genai
      - google-search-results
      - python-dotenv

      # GUI (pinned for canvas compatibility)
      - streamlit==1.39.0
      - streamlit-drawable-canvas==0.9.3

      # Image I/O
      - tifffile
      - opencv-contrib-python-headless
      - Pillow
      - imageio

      # Deep learning utils
      - timm==0.6.13
      - einops
      - transformers
      - huggingface-hub
      - safetensors
      - accelerate

      # Model components
      - pydantic
      - fairscale
      - setuptools

      # Misc
      - aiofiles
      - matplotlib
      - seaborn
      - pandas
      - tqdm
      - pyyaml
      - requests
      - beautifulsoup4

      # SAM3: install after env creation:
      #   cd src/sam3 && pip install -e ".[notebooks,train,dev]"
